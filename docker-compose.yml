services:
  whoami:
    image: traefik/whoami:latest
    container_name: whoami_gh
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`test.oberhofer.work`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
        
networks:
  traefik:
    external: true
  backend:
    internal: true
